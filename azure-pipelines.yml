# Pipeline del front: solo CI (valida y compila). NO despliega.
# El despliegue lo hace el pipeline "Oklahoma Burgers back", que se dispara
# automaticamente cuando este termina bien y consume el artefacto "front-dist".
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Instalar Node.js'

  - script: npm ci
    displayName: 'Instalar dependencias'

  # Mismas compuertas que Husky, pero que no se pueden saltar con --no-verify.
  - script: npm run format:check
    displayName: 'Formato (Prettier)'

  - script: npm run lint
    displayName: 'Lint'

  - script: npm test
    displayName: 'Pruebas unitarias (Vitest)'

  - script: npm run build
    displayName: 'Compilar el front'

  - publish: '$(System.DefaultWorkingDirectory)/dist'
    artifact: front-dist
    displayName: 'Publicar build del front'
