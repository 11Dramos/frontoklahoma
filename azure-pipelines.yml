# Pipeline del front: solo CI (valida y compila). NO despliega.
# El despliegue lo hace el pipeline "Oklahoma Burgers back", que se dispara
# automaticamente cuando este termina bien y consume el artefacto "front-dist".
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # fetchDepth 0: SonarCloud necesita el historial completo para atribuir lineas nuevas.
  - checkout: self
    fetchDepth: 0

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Instalar Node.js'

  - script: npm ci
    displayName: 'Instalar dependencias'

  # Mismas compuertas que Husky, pero que no se pueden saltar con --no-verify.
  - script: npm run format:check
    displayName: 'Formato (Prettier)'

  - script: npm run lint
    displayName: 'Lint'

  - script: npm run test:coverage
    displayName: 'Pruebas unitarias (Vitest) con cobertura'

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
    displayName: 'Publicar cobertura en Azure'

  - publish: '$(System.DefaultWorkingDirectory)/coverage'
    artifact: coverage-front
    condition: succeededOrFailed()
    displayName: 'Publicar reporte HTML de cobertura'

  # Analisis de calidad en SonarCloud (bugs, vulnerabilidades, code smells, duplicados y cobertura).
  # Necesita las variables SONAR_TOKEN (secreta) y SONAR_ORGANIZATION del pipeline; si faltan, se omite
  # sin romper el pipeline. Para que ademas bloquee el despliegue, cambia sonar.qualitygate.wait a true.
  - script: |
      if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = '$(SONAR_TOKEN)' ] || [ -z "$SONAR_ORGANIZATION" ] || [ "$SONAR_ORGANIZATION" = '$(SONAR_ORGANIZATION)' ]; then
        echo "SonarCloud no configurado (faltan SONAR_TOKEN y SONAR_ORGANIZATION): se omite el analisis."
        exit 0
      fi
      npx --yes @sonar/scan \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.organization="$SONAR_ORGANIZATION" \
        -Dsonar.projectKey="${SONAR_ORGANIZATION}_oklahoma-front" \
        -Dsonar.projectName="Oklahoma Front" \
        -Dsonar.qualitygate.wait=false
    displayName: 'Analisis SonarCloud'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)
      SONAR_ORGANIZATION: $(SONAR_ORGANIZATION)

  - script: npm run build
    displayName: 'Compilar el front'

  - publish: '$(System.DefaultWorkingDirectory)/dist'
    artifact: front-dist
    displayName: 'Publicar build del front'
