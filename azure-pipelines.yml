# Pipeline del front: solo CI (valida y compila). NO despliega.
# El despliegue lo hace el pipeline "Oklahoma Burgers back", que se dispara
# automaticamente cuando este termina bien y consume el artefacto "front-dist".
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Grupo de la Library (Pipelines > Library > oklahoma-front). Debe tener:
  #   sonar_tokens        token de SonarCloud (marcalo como secreto con el candado)
  #   sonar_organization  clave de tu organizacion en SonarCloud
  - group: oklahoma-front

steps:
  # fetchDepth 0: SonarCloud necesita el historial completo para atribuir lineas nuevas.
  - checkout: self
    fetchDepth: 0

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Instalar Node.js'

  - script: npm ci
    displayName: 'Instalar dependencias'

  # Mismas compuertas que Husky, pero que no se pueden saltar con --no-verify.
  - script: npm run format:check
    displayName: 'Formato (Prettier)'

  - script: npm run lint
    displayName: 'Lint'

  - script: npm run test:coverage
    displayName: 'Pruebas unitarias (Vitest) con cobertura'

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
    displayName: 'Publicar cobertura en Azure'

  - publish: '$(System.DefaultWorkingDirectory)/coverage'
    artifact: coverage-front
    condition: succeededOrFailed()
    displayName: 'Publicar reporte HTML de cobertura'

  # Analisis de calidad en SonarCloud (bugs, vulnerabilidades, code smells, duplicados y cobertura).
  # Usa sonar_tokens y sonar_organization del grupo oklahoma-front; si faltan, se omite sin romper el
  # pipeline. Si SonarCloud falla (token invalido, etc.) queda como advertencia y no frena el despliegue.
  # Para que ademas bloquee por quality gate, cambia sonar.qualitygate.wait a true.
  - script: |
      if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = '$(sonar_tokens)' ] || [ -z "$SONAR_ORGANIZATION" ] || [ "$SONAR_ORGANIZATION" = '$(sonar_organization)' ]; then
        echo "SonarCloud no configurado (faltan sonar_tokens y sonar_organization en el grupo oklahoma-front): se omite el analisis."
        exit 0
      fi
      npx --yes @sonar/scan \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.organization="$SONAR_ORGANIZATION" \
        -Dsonar.projectKey="${SONAR_ORGANIZATION}_oklahoma-front" \
        -Dsonar.projectName="Oklahoma Front" \
        -Dsonar.qualitygate.wait=false
    displayName: 'Analisis SonarCloud'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    continueOnError: true
    env:
      SONAR_TOKEN: $(sonar_tokens)
      SONAR_ORGANIZATION: $(sonar_organization)

  - script: npm run build
    displayName: 'Compilar el front'

  - publish: '$(System.DefaultWorkingDirectory)/dist'
    artifact: front-dist
    displayName: 'Publicar build del front'
