trigger:
  - main

resources:
  repositories:
    - repository: back
      type: git
      name: 'Oklahoma Burgers/Oklahoma Burgers back'
      ref: main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Nombre de la conexion de servicio a Azure creada en Project Settings > Service connections.
  azureSubscription: 'oklahoma-azure-connection'
  webAppName: 'oklahoma-rg'

stages:
  - stage: Build
    jobs:
      - job: BuildFront
        steps:
          - checkout: self
            path: front

          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js'

          - script: |
              npm ci
              npm run build
            displayName: 'Instalar dependencias y compilar el front'
            workingDirectory: '$(Pipeline.Workspace)/front'

          - publish: '$(Pipeline.Workspace)/front/dist'
            artifact: front-dist

      - job: BuildBack
        steps:
          - checkout: back
            path: back

          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js'

          - script: npm ci --omit=dev
            displayName: 'Instalar dependencias del backend'
            workingDirectory: '$(Pipeline.Workspace)/back'

          - publish: '$(Pipeline.Workspace)/back'
            artifact: back-app

  - stage: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToAzure
        environment: 'produccion-azure'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    mkdir -p $(Pipeline.Workspace)/back-app/public
                    cp -r $(Pipeline.Workspace)/front-dist/. $(Pipeline.Workspace)/back-app/public/
                  displayName: 'Copiar el build del front dentro del backend'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/back-app'
                  displayName: 'Desplegar a Azure App Service'
