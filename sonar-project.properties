# Configuracion del analisis de SonarCloud (la corre el pipeline de Azure).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.exclusions=**/*.test.js,**/*.test.jsx,src/main.jsx
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,src/main.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
